---
name: CD for Satora Testnet

on:
    push:
        tags:
            - '**beta-swaps**'
    workflow_dispatch:


jobs:
    deploy-satora-testnet:
        runs-on: ubuntu-latest
        environment:
            name: Satora-Testnet
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
              with:
                  role-to-assume: ${{ secrets.SATORA_TESTNET_ROLE_ARN }}
                  aws-region: "${{ secrets.SATORA_TESTNET_AWS_REGION }}"

            - name: Deploy rif-relay-server on Satora Testnet
              env:
                  INSTANCE_ID: ${{ secrets.SATORA_TESTNET_EC2_ID }}
                  AWS_REGION: ${{ secrets.SATORA_TESTNET_AWS_REGION }}
              run: |
                  command_id=$(aws ssm send-command \
                      --document-name "AWS-RunRemoteScript" \
                      --instance-ids "$INSTANCE_ID" \
                      --region "$AWS_REGION" \
                      --parameters '{"sourceType":["GitHub"],"sourceInfo":["{\"owner\":\"rootstock\", \"repository\":\"ask-devops\", \"path\": \"rif-relay/\", \"tokenInfo\":\"{{ssm-secure:github-token}}\"}"],"commandLine":["deploy-satora-testnet.sh"]}' \
                      --query 'Command.CommandId' --output text)
                  echo "Sent SSM command $command_id"

                  # send-command only queues the script on the instance: wait until it finishes
                  # (up to 20 minutes) and fail the job unless it succeeded. The status of the
                  # invocation covers every step of the document, so no step name is needed.
                  status=Pending
                  errors=0
                  for _ in $(seq 1 120); do
                      sleep 10
                      if ! status=$(aws ssm list-command-invocations \
                          --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
                          --query 'CommandInvocations[0].Status' --output text 2>poll-error.txt); then
                          errors=$((errors + 1))
                          cat poll-error.txt >&2
                          if [ "$errors" -ge 5 ]; then
                              echo "::error::Could not read the status of SSM command $command_id"
                              exit 1
                          fi
                          continue
                      fi
                      errors=0
                      case "$status" in
                          None|Pending|InProgress|Delayed|Cancelling) ;;
                          *) break ;;
                      esac
                  done

                  # a multi-step document has to be read one step at a time
                  plugins=$(aws ssm list-command-invocations \
                      --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
                      --details --query 'CommandInvocations[0].CommandPlugins[].Name' --output text || true)
                  for plugin in $plugins; do
                      echo "::group::$plugin output"
                      aws ssm get-command-invocation \
                          --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
                          --plugin-name "$plugin" --query 'StandardOutputContent' --output text || true
                      aws ssm get-command-invocation \
                          --command-id "$command_id" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
                          --plugin-name "$plugin" --query 'StandardErrorContent' --output text >&2 || true
                      echo "::endgroup::"
                  done

                  if [ "$status" != "Success" ]; then
                      echo "::error::Deployment ended with status $status"
                      exit 1
                  fi
