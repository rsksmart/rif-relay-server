name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linting_and_testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm install

      - name: Check Linter bugs
        run: npm run lint

      - name: Check Codestyles errors
        run: npm run format
      
      - name: Run unit tests
        run: npm run test
